name: Local workbench
on:
  push:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r workbench/requirements-test.txt
      - run: python -m unittest discover -s workbench/tests -v
      - run: python scripts/package_skill.py --check
